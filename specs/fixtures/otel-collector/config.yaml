receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
exporters:
  file/traces:
    path: /output/traces.json
    format: json
    flush_interval: 100ms
  file/metrics:
    path: /output/metrics.json
    format: json
    flush_interval: 100ms
  file/logs:
    path: /output/logs.json
    format: json
    flush_interval: 100ms
service:
  telemetry:
    logs:
      level: warn
  pipelines:
    traces:
      receivers: [otlp]
      exporters: [file/traces]
    metrics:
      receivers: [otlp]
      exporters: [file/metrics]
    logs:
      receivers: [otlp]
      exporters: [file/logs]
