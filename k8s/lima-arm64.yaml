# The arm64 CI node: an Ubuntu 24.04 aarch64 VM on the Mac Studio (Lima, Apple's Virtualization framework). limactl start --name fibber-a64 k8s/lima-arm64.yaml
# Capped at 8 CPUs / 16 GiB (the Mac has other uses). vzNAT: the VM reaches the LAN (and lilnas:6443) outward; nothing reaches it, which a k3s agent
# does not need (it dials the server and the API server reaches the kubelet through that tunnel). No host mounts, no containerd of Lima's.
minimumLimaVersion: 2.0.0
base: template:ubuntu-24.04
vmType: vz
arch: aarch64
cpus: 8
memory: 16GiB
disk: 80GiB
mounts: []
containerd: {system: false, user: false}
networks:
  - vzNAT: true
