# The ceiling for the whole namespace: the owner's other workloads on lilnas (28 threads, 61 GB) are never starved by CI.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: fibber-ci
  namespace: fibber-ci
spec:
  hard:
    requests.cpu: "16"
    requests.memory: 32Gi
    limits.cpu: "16"
    limits.memory: 32Gi
    pods: "100"
    count/jobs.batch: "200"
    persistentvolumeclaims: "10"
    requests.storage: 200Gi
---
# What a container gets when its manifest says nothing (a quota needs every container to have limits).
apiVersion: v1
kind: LimitRange
metadata:
  name: fibber-ci
  namespace: fibber-ci
spec:
  limits:
    - type: Container
      default: {cpu: "2", memory: 4Gi}
      defaultRequest: {cpu: 500m, memory: 1Gi}
      max: {cpu: "16", memory: 32Gi}
