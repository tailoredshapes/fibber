# The identity a CI client (the GitLab runner, a script) uses inside fibber-ci: it reads jobs, pods, logs, configmaps and secrets here, and
# creates jobs and pods here. It has no cluster role and no right in any other namespace.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: fibber-ci
  namespace: fibber-ci
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: fibber-ci
  namespace: fibber-ci
rules:
  - apiGroups: [""]
    resources: [pods, pods/log, configmaps, secrets, persistentvolumeclaims, events]
    verbs: [get, list, watch]
  - apiGroups: ["batch"]
    resources: [jobs, cronjobs]
    verbs: [get, list, watch, create, delete]
  - apiGroups: [""]
    resources: [pods]
    verbs: [create, delete]
  - apiGroups: [""]
    resources: [pods/exec, pods/attach]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: fibber-ci
  namespace: fibber-ci
subjects:
  - kind: ServiceAccount
    name: fibber-ci
    namespace: fibber-ci
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: fibber-ci
