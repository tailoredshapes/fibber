# The work volume: the tree (streamed in by `make k8s-src` from the working tree), build/, the mk scratch cache and the seed, per
# architecture (local-path volumes belong to one node; the arm64 node has its own claim, k8s/arm64.yaml). Nothing here is a source of
# truth: `make k8s-clean-all` deletes it.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: work-amd64
  namespace: fibber-ci
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources: {requests: {storage: 60Gi}}
