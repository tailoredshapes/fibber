# A tiny pod that holds the work volume open so `make k8s-src` can stream the tree into it (kubectl exec -i ... tar -x). It has no
# network beyond the default policy. busybox is pinned by digest (docs/adr/0020).
apiVersion: v1
kind: Pod
metadata:
  name: loader-amd64
  namespace: fibber-ci
  labels: {fibber/role: loader}
spec:
  priorityClassName: fibber-ci-low
  restartPolicy: Always
  nodeSelector: {kubernetes.io/arch: amd64}
  securityContext: {runAsUser: 1000, runAsGroup: 1000, fsGroup: 1000}
  containers:
    - name: loader
      image: busybox@sha256:bdf57e528e45e4433820e045b29b4597825a1c9e38353532d90a01445013f82e
      command: [sleep, "2592000"]
      resources:
        requests: {cpu: 10m, memory: 16Mi}
        limits: {cpu: 500m, memory: 256Mi}
      volumeMounts: [{name: work, mountPath: /work}]
  volumes:
    - name: work
      persistentVolumeClaim: {claimName: work-amd64}
