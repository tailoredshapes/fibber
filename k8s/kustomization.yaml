# `make k8s-apply` = kubectl apply -k k8s/. The job templates (job.yaml.in, cronjob.yaml.in) are rendered by mk/k8s.mk, not applied here.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - quota.yaml
  - rbac.yaml
  - netpol.yaml
  - storage.yaml
  - loader.yaml
