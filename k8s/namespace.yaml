# fibber-ci: everything the fibber jobs run in (docs/design/build.md, Kubernetes). Namespace-scoped objects only, plus one PriorityClass.
apiVersion: v1
kind: Namespace
metadata:
  name: fibber-ci
  labels:
    app.kubernetes.io/part-of: fibber
    fibber/ci: "true"
---
# Lower than every other class on the cluster (the system classes are 2e9; the owner's pods have none, so 0): a fibber job yields to them.
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: fibber-ci-low
value: -1000
globalDefault: false
preemptionPolicy: Never
description: "fibber CI jobs: below every other workload on the cluster; never preempts"
