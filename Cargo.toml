[workspace]
resolver = "2"
members = ["crates/fibref", "crates/fibgen", "crates/lir", "crates/lair", "crates/fibc"]

# The reference interpreter runs programs of a million steps in its
# tests (cases/ownership/07, the proposed cases 52, 53 and 65); unoptimised
# it takes minutes for them. Level 1 keeps debug assertions and overflow
# checks, and cuts case 07 from 34 s to under 3 s.
[profile.dev]
opt-level = 1
