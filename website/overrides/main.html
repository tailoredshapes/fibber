{% extends "base.html" %}
{% block extrahead %}
  {{ super() }}
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Fibber">
  <meta property="og:title" content="{{ (page.title if page else config.site_name) | e }} · Fibber">
  <meta property="og:description" content="{{ ((page.meta.description if page else '') or config.site_description) | e }}">
  <meta property="og:url" content="{{ (page.canonical_url if page else config.site_url) | e }}">
  <meta name="twitter:card" content="summary">
  <meta name="theme-color" content="#173d32">
{% endblock %}
