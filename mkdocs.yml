site_name: Fibber
site_description: A Lisp with static types, native code and memory safety without a garbage collector. Borrow first, count second.
site_url: https://tailoredshapes.github.io/fibber/
repo_url: https://github.com/tailoredshapes/fibber
repo_name: tailoredshapes/fibber
edit_uri: ''
docs_dir: build/pages-source
site_dir: build/pages
strict: true
hooks:
  - website/hooks.py
watch:
  - website
  - docs
  - spec
  - lib/fib
  - README.md
  - VERSION
theme:
  name: material
  custom_dir: website/overrides
  favicon: assets/favicon.svg
  logo: assets/favicon.svg
  font: false
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow
plugins:
  - search
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
extra_css:
  - assets/extra.css
extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/tailoredshapes/fibber
      name: Fibber on GitHub
copyright: Fibber · BSD 3-Clause
nav:
  - Home: index.md
  - Learn:
      - Install and hello: docs/tutorial/01-install-and-hello.md
      - Values and collections: docs/tutorial/02-values-and-collections.md
      - Functions and types: docs/tutorial/03-functions-and-types.md
      - Ownership by example: docs/tutorial/04-ownership-by-example.md
      - A project: docs/tutorial/05-a-project.md
      - Concurrency: docs/tutorial/06-concurrency.md
      - Ship a program: docs/tutorial/07-ship-it.md
  - Guides:
      - Ownership and borrowing: docs/guide/ownership-and-borrowing.md
      - Modules and namespaces: docs/guide/modules-and-namespaces.md
      - Protocols, records and enums: docs/guide/protocols-records-and-enums.md
      - Errors, traps and try: docs/guide/errors-traps-and-try.md
      - Macros: docs/guide/macros.md
      - Concurrency and parallelism: docs/guide/concurrency-and-parallelism.md
      - Packages and dependencies: docs/guide/packages-and-dependencies.md
      - Numerics, SIMD and tensors: docs/guide/numerics-simd-tensors.md
      - GPU kernels: docs/guide/gpu-kernels.md
      - Unsafe FFI and drivers: docs/guide/unsafe-ffi-and-drivers.md
      - Testing: docs/guide/testing.md
      - Tooling and editors: docs/guide/tooling.md
      - Targets and deployment: docs/guide/targets-and-deployment.md
  - Reference:
      - Language: docs/reference/language.md
      - Builtins: docs/reference/builtins.md
      - CLI: docs/reference/cli.md
      - Environment: docs/reference/environment.md
      - Diagnostics: docs/reference/diagnostics.md
      - File formats: docs/reference/file-formats.md
      - Compiler targets: docs/reference/targets.md
      - Specification:
          - Syntax: spec/syntax.md
          - Types: spec/types.md
          - Ownership: spec/ownership.md
          - Validation method: spec/method.md
  - Library:
      - Module index: docs/reference/library/INDEX.md
      - Tensors: lib/fib/tensor/README.md
      - Relational search: lib/fib/logic/README.md
      - OS services: lib/fib/os/README.md
      - HTTP: lib/fib/http/README.md
      - Compression: lib/fib/compress/README.md
      - Crypto contracts: lib/fib/crypto/README.md
      - TLS client: lib/fib/tls/README.md
  - Project:
      - Documentation map: docs/README.md
      - Examples: examples/README.md
      - Contributing: CONTRIBUTING.md
      - Changelog: CHANGELOG.md
      - Stability: docs/policy/stability.md
      - Platforms: docs/policy/platform-support.md
      - Known limits: docs/policy/limits.md
      - Security: SECURITY.md
