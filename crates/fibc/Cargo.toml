[package]
name = "fibc"
version = "0.1.0"
edition = "2021"
description = "The fibber compiler: the checker's plan lowered to lIR (spec/compiler.md, types §8)"
publish = false

[lib]
name = "fibc"
path = "src/lib.rs"

[[bin]]
name = "fibc"
path = "src/main.rs"

[features]
# `llvm` links `lair` (and LLVM) for `fibc run`, `fibc build` and the
# rule-6 harness; without it `fibc emit` and the emit tests build alone.
default = ["llvm"]
llvm = ["dep:lair"]
# `mirror` turns on the differential test of the self-hosted expander
# (`tests/bootstrap_expand`, the stage-2a tool `compiler/expand.fib`
# against `fibref expand`). It is off by default while M6's expander port
# is behind the Rust one (compiler/mirror-pending/, ROADMAP M6): run it
# with `cargo test -p fibc --features mirror --test bootstrap_expand`.
mirror = ["llvm"]

[dependencies]
fibref = { path = "../fibref" }
fibgen = { path = "../fibgen" }
lir = { path = "../lir" }
lair = { path = "../lair", optional = true }

[[test]]
name = "cases"
required-features = ["llvm"]

[[test]]
name = "macros"
required-features = ["llvm"]

[[test]]
name = "gen"
required-features = ["llvm"]

[[test]]
name = "defs"
required-features = ["llvm"]

[[test]]
name = "cli"
required-features = ["llvm"]

[[test]]
name = "capi"
required-features = ["llvm"]

[[test]]
name = "bootstrap"
required-features = ["llvm"]

[[test]]
name = "floats"
required-features = ["llvm"]

[[test]]
name = "files"
required-features = ["llvm"]

[[test]]
name = "bootstrap_expand"
required-features = ["mirror"]
