[package]
name = "fibgen"
version = "0.1.0"
edition = "2021"
description = "Random well-typed fibber programs checked against the reference interpreter's memory audit (spec/method.md, rule 5)"
publish = false

[lib]
name = "fibgen"
path = "src/lib.rs"

[[bin]]
name = "fibgen"
path = "src/main.rs"

[dependencies]
fibref = { path = "../fibref" }
