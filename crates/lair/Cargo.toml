[package]
name = "lair"
version = "0.1.0"
edition = "2021"
description = "lIR to native code through LLVM: JIT and AOT (spec/lir.md §11, §12)"
publish = false

[lib]
name = "lair"
path = "src/lib.rs"
# The rlib is what `fibc`, the `lair` binary and the tests link; the
# cdylib is `liblair.so`, the C interface of spec/compiler.md §9
# (include/lair.h).
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "lair"
path = "src/main.rs"

[dependencies]
lir = { path = "../lir" }
llvm-sys = "211"

[features]
# Test-only. Lets a test provoke a panic at a real exported entry
# (`lair_check_source` on one fixed text, `lair_call_i64` at one fixed
# address), to see it leave as an error and as 0 and not unwind into C
# (`tests/capi_panic.rs`). No build of the library has it on: the
# dev-dependency below turns it on for `cargo test -p lair` alone.
test-panic = []

[dev-dependencies]
lair = { path = ".", features = ["test-panic"] }
