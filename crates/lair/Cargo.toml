[package]
name = "lair"
version = "0.1.0"
edition = "2021"
description = "lIR to native code through LLVM: JIT and AOT (spec/lir.md §11, §12)"
publish = false

[lib]
name = "lair"
path = "src/lib.rs"

[[bin]]
name = "lair"
path = "src/main.rs"

[dependencies]
lir = { path = "../lir" }
llvm-sys = "211"
