name: release

# A pushed tag v* builds the release for that tag and attaches the tarball and SHA256SUMS to a GitHub release of the same name.
#   v0.1.*  and later: fibc written in fibber (scripts/package.sh), built by the seed that SEED names (scripts/fetch-seed.sh); the tag
#           has to equal v + the file VERSION. (The v0.0.* releases, the Rust tools, are built from tag seed-1; docs/rust-legacy.md.)
# workflow_dispatch does the same for an existing tag given as input.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'An existing tag to build and release, such as v0.1.0'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 5
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      # LLVM 21 from apt.llvm.org and its development package: the static archives scripts/package.sh links into fibc (scripts/llvm-static.sh).
      - name: Install LLVM 21
        timeout-minutes: 15
        run: |
          wget -qO llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 21
          sudo apt-get install -y llvm-21-dev libpolly-21-dev libzstd-dev zlib1g-dev libxml2-dev
          /usr/lib/llvm-21/bin/llvm-config --version

      - name: Fetch the seed
        id: seed
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "fibc=$(scripts/fetch-seed.sh seed)" >> "$GITHUB_OUTPUT"

      - name: Package fibc
        timeout-minutes: 90
        env:
          FIBC: ${{ steps.seed.outputs.fibc }}
        run: |
          test "v$(cat VERSION)" = "$TAG" || { echo "tag $TAG is not v$(cat VERSION), the file VERSION" >&2; exit 1; }
          scripts/package.sh dist

      - name: Check the unpacked tarball runs with an empty environment
        timeout-minutes: 10
        run: |
          mkdir unpacked
          tar -xzf dist/fibc-*-linux-x86_64.tar.gz -C unpacked
          echo '(defun main () -> i64 (do (println "hello from fibber") 0))' > hello.fib
          env -i unpacked/fibc-*/bin/fibc run hello.fib

      - uses: actions/upload-artifact@v4
        timeout-minutes: 5
        with:
          name: dist
          path: |
            dist/*.tar.gz
            dist/SHA256SUMS

      # gh is on the runner; GITHUB_TOKEN is the default one, with contents: write from the permissions above.
      - name: Create the release
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$TAG" dist/*.tar.gz dist/SHA256SUMS --verify-tag --title "$TAG" --generate-notes

  # The VS Code extension (editors/vscode) as a .vsix on the same release: install with `code --install-extension FILE.vsix`.
  vsix:
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 5
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}

      - uses: actions/setup-node@v4
        timeout-minutes: 5
        with:
          node-version: 22

      - name: Package the extension
        timeout-minutes: 5
        working-directory: editors/vscode
        run: |
          npx --yes @vscode/vsce package --out "fibber-vscode.vsix"

      - name: Attach it to the release
        timeout-minutes: 5
        working-directory: editors/vscode
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          v=$(node -p "require('./package.json').version")
          mv fibber-vscode.vsix "fibber-vscode-$v.vsix"
          gh release upload "$TAG" "fibber-vscode-$v.vsix" --clobber
