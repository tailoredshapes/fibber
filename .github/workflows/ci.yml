name: ci

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  # The interpreter, the generator and lIR's checker: no LLVM, so this
  # job stays fast and is the one to watch.
  fibref:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install stable toolchain with rustfmt and clippy
        run: |
          rustup update stable
          rustup default stable
          rustup component add rustfmt clippy

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: fibref

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy -p fibref -p fibgen -p lir --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test -p fibref -p fibgen -p lir

      # Pending cases exit 0 and are listed; a Fail, a bad header or a
      # run that found no cases exits 1 and must fail the build.
      - name: Ownership cases
        run: |
          cargo run -p fibref -- cases cases/ownership
          cargo run -p fibref -- cases cases/modules

  # lair links LLVM 21 statically through llvm-sys (crates/lair), which
  # takes minutes per link, so it is a job of its own. fibc links lair,
  # so its tests are here too, after lair's own, and the whole job
  # builds the workspace once: one LLVM install, one cache.
  lair:
    runs-on: ubuntu-latest
    env:
      LLVM_SYS_211_PREFIX: /usr/lib/llvm-21
    steps:
      - uses: actions/checkout@v4

      - name: Install stable toolchain with clippy
        run: |
          rustup update stable
          rustup default stable
          rustup component add clippy

      # apt.llvm.org's llvm.sh installs LLVM 21's tools and adds the
      # repository; llvm-sys then needs the development package (for
      # llvm-config and the static archives), Polly's archives, which
      # `llvm-config --libs` lists, and the system libraries
      # `llvm-config --system-libs --link-static` lists: zlib, zstd
      # (as /usr/lib/x86_64-linux-gnu/libzstd.a) and libxml2.
      - name: Install LLVM 21
        run: |
          wget -qO llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 21
          sudo apt-get install -y llvm-21-dev libpolly-21-dev libzstd-dev zlib1g-dev libxml2-dev
          /usr/lib/llvm-21/bin/llvm-config --version
          /usr/lib/llvm-21/bin/llvm-config --system-libs --link-static

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: lair

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      # cargo test -p lair runs every lIR case through the JIT and AOT
      # (crates/lair/tests/cases.rs, spec/lir.md §13), the JIT's library
      # tests, the macro mechanism among them, the C interface and the
      # link step (crates/lair/tests/link.rs). It is the quick one, so it
      # goes first.
      - name: Test lair
        run: cargo test -p lair

      # crates/fibc is not in the fibref job: it needs LLVM. Its tests
      # are the compiler itself: the rule-6 suites (tests/cases.rs runs
      # cases/ownership and cases/modules interpreted and compiled, as
      # `fibc cases DIR` does, and fails on a Fail, a bad header or no
      # cases), the generated programs, the fibber reader of the
      # bootstrap (tests/bootstrap.rs), the C interface from fibber
      # (tests/capi.rs, which builds liblair.so) and `fibc build`'s flags
      # (tests/cli.rs). Two test threads: each case and each generated
      # program runs a child process that compiles through the JIT, and
      # the generator's jobs each hold an interpreter's heap trace.
      - name: Test fibc
        run: cargo test -p fibc -- --test-threads=2
