name: ci

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install stable toolchain with rustfmt and clippy
        run: |
          rustup update stable
          rustup default stable
          rustup component add rustfmt clippy

      # lair links LLVM 21 through llvm-sys (crates/lair). apt.llvm.org's
      # packages provide the static libraries; llvm-sys also needs Polly's
      # and zstd's development files. This step has not yet run on GitHub.
      - name: Install LLVM 21
        run: |
          wget -qO- https://apt.llvm.org/llvm.sh | sudo bash -s -- 21
          sudo apt-get install -y llvm-21-dev libpolly-21-dev libzstd-dev zlib1g-dev libxml2-dev
          echo "LLVM_SYS_211_PREFIX=/usr/lib/llvm-21" >> "$GITHUB_ENV"

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --workspace

      # Pending cases exit 0 and are listed; a Fail, a bad header or a
      # run that found no cases exits 1 and must fail the build.
      - name: Ownership cases
        run: cargo run -p fibref -- cases cases/ownership

      # Every lIR case through the JIT and through AOT (spec/lir.md §13).
      - name: lIR cases
        run: cargo run -p lair -- cases cases/lir
