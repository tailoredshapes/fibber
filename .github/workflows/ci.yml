name: ci

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # Pinned: the Rust is frozen (seed-1), and a newer stable's new lints
  # would fail it without a change in it. Bump deliberately.
  RUST_TOOLCHAIN: 1.97.1

jobs:
  # The interpreter, the generator and lIR's checker: no LLVM, so this
  # job stays fast and is the one to watch.
  fibref:
    runs-on: ubuntu-latest
    # A hung test would hold the job for GitHub's default of 6 hours;
    # every job and every step that runs something has a limit, a few
    # times what it takes on a cold cache.
    timeout-minutes: 30
    steps:
      # The Rust is frozen as the seed (tag seed-1) and the data it tests
      # (cases/, lib/, spec/) has moved on; the Rust tests judge the Rust
      # against the data of its own time. The stage2 job judges main.
      - uses: actions/checkout@v4
        timeout-minutes: 5
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Overlay the seed's data (tag seed-1)
        timeout-minutes: 5
        run: scripts/ci-seed-overlay.sh

      - name: Install the pinned toolchain with rustfmt and clippy
        timeout-minutes: 10
        run: |
          rustup toolchain install $RUST_TOOLCHAIN --profile minimal -c rustfmt -c clippy
          rustup default $RUST_TOOLCHAIN

      - uses: Swatinem/rust-cache@v2
        timeout-minutes: 10
        with:
          prefix-key: fibref

      - name: Format
        timeout-minutes: 5
        run: cargo fmt --all --check

      - name: Clippy
        timeout-minutes: 15
        run: cargo clippy -p fibref -p fibgen -p lir --all-targets --all-features -- -D warnings

      - name: Test
        timeout-minutes: 20
        run: cargo test -p fibref -p fibgen -p lir

      # Pending cases exit 0 and are listed; a Fail, a bad header or a
      # run that found no cases exits 1 and must fail the build.
      - name: Ownership cases
        timeout-minutes: 10
        run: |
          cargo run -p fibref -- cases cases/ownership
          cargo run -p fibref -- cases cases/modules

  # lair links LLVM 21 statically through llvm-sys (crates/lair), which
  # takes minutes per link, so it is a job of its own. fibc links lair,
  # so its tests are here too, after lair's own, and the whole job
  # builds the workspace once: one LLVM install, one cache.
  lair:
    runs-on: ubuntu-latest
    # The sum of the step limits below is more than this; a cold cache
    # builds LLVM's static link once, in the first step that needs it.
    timeout-minutes: 90
    env:
      LLVM_SYS_211_PREFIX: /usr/lib/llvm-21
    steps:
      # The Rust is frozen as the seed (tag seed-1) and the data it tests
      # (cases/, lib/, spec/) has moved on; the Rust tests judge the Rust
      # against the data of its own time. The stage2 job judges main.
      - uses: actions/checkout@v4
        timeout-minutes: 5
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Overlay the seed's data (tag seed-1)
        timeout-minutes: 5
        run: scripts/ci-seed-overlay.sh

      - name: Install the pinned toolchain with clippy
        timeout-minutes: 10
        run: |
          rustup toolchain install $RUST_TOOLCHAIN --profile minimal -c clippy
          rustup default $RUST_TOOLCHAIN

      # apt.llvm.org's llvm.sh installs LLVM 21's tools and adds the
      # repository; llvm-sys then needs the development package (for
      # llvm-config and the static archives), Polly's archives, which
      # `llvm-config --libs` lists, and the system libraries
      # `llvm-config --system-libs --link-static` lists: zlib, zstd
      # (as /usr/lib/x86_64-linux-gnu/libzstd.a) and libxml2.
      - name: Install LLVM 21
        timeout-minutes: 15
        run: |
          wget -qO llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 21
          sudo apt-get install -y llvm-21-dev libpolly-21-dev libzstd-dev zlib1g-dev libxml2-dev
          /usr/lib/llvm-21/bin/llvm-config --version
          /usr/lib/llvm-21/bin/llvm-config --system-libs --link-static

      - uses: Swatinem/rust-cache@v2
        timeout-minutes: 10
        with:
          prefix-key: lair

      - name: Clippy
        timeout-minutes: 30
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      # cargo test -p lair runs every lIR case through the JIT and AOT
      # (crates/lair/tests/cases.rs, spec/lir.md §13), the JIT's library
      # tests, the macro mechanism among them, the C interface and the
      # link step (crates/lair/tests/link.rs). It is the quick one, so it
      # goes first.
      - name: Test lair
        timeout-minutes: 45
        run: cargo test -p lair

      # crates/fibc is not in the fibref job: it needs LLVM. Its tests
      # are the compiler itself: the rule-6 suites (tests/cases.rs runs
      # cases/ownership and cases/modules interpreted and compiled, as
      # `fibc cases DIR` does, and fails on a Fail, a bad header or no
      # cases), the generated programs, the fibber reader of the
      # bootstrap (tests/bootstrap.rs), the C interface from fibber
      # (tests/capi.rs, which builds liblair.so) and `fibc build`'s flags
      # (tests/cli.rs). Two test threads: each case and each generated
      # program runs a child process that compiles through the JIT, and
      # the generator's jobs each hold an interpreter's heap trace.
      - name: Test fibc
        timeout-minutes: 45
        run: cargo test -p fibc -- --test-threads=2

  # The truth about main: the released seed (the one SEED names: a stage 2
  # binary with its own liblair.so, no Rust and no LLVM install needed)
  # builds stage 2 from main's compiler/ and lib/; the fixed point holds;
  # stage 2 runs the case directories, and the cases that do not pass are
  # exactly those in scripts/ci-stage2.expected.
  stage2:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      LLVM_SYS_211_PREFIX: /usr/lib/llvm-21
    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 5

      - name: Fetch the seed (SEED names the release and its sha256)
        timeout-minutes: 10
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          fibc=$(scripts/fetch-seed.sh "$RUNNER_TEMP/seed")
          echo "SEED_FIBC=$fibc" >> "$GITHUB_ENV"
          echo "SEED_LIB=$(cd "$(dirname "$fibc")/../lib" && pwd)" >> "$GITHUB_ENV"

      # The tree's own lair: stage 2 links the code generator of the tree it is built from (it may call entries the seed's
      # liblair.so lacks), so the Rust toolchain and LLVM come back for this one crate.
      - name: Install the pinned toolchain
        timeout-minutes: 10
        run: |
          rustup toolchain install $RUST_TOOLCHAIN --profile minimal
          rustup default $RUST_TOOLCHAIN

      - name: Install LLVM 21
        timeout-minutes: 15
        run: |
          wget -qO llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 21
          sudo apt-get install -y llvm-21-dev libpolly-21-dev libzstd-dev zlib1g-dev libxml2-dev

      - uses: Swatinem/rust-cache@v2
        timeout-minutes: 10
        with:
          prefix-key: stage2-lair

      - name: Build lair (release)
        timeout-minutes: 30
        run: cargo build --release -p lair

      - name: Build stage 2 and check it
        timeout-minutes: 30
        run: |
          set -eu
          export FIB_LIB=$PWD/lib LAIR=$PWD/target/release LD_LIBRARY_PATH=$PWD/target/release
          build() { "$1" build compiler/fibc.fib -I compiler -I lib -L "$LAIR" -l lair -o "$2"; }
          emit() { "$1" emit -I compiler -I lib compiler/fibc.fib; }
          build "$SEED_FIBC" "$RUNNER_TEMP/F"
          emit "$SEED_FIBC" > "$RUNNER_TEMP/emit.seed"
          emit "$RUNNER_TEMP/F" > "$RUNNER_TEMP/emit.F"
          # The seed's lIR differs from F's whenever main's compiler or library moved on: a note. The check is the
          # fixed point: stage 2 built by the seed and stage 3 built by stage 2 emit the same lIR.
          if cmp -s "$RUNNER_TEMP/emit.seed" "$RUNNER_TEMP/emit.F"; then echo "note: F emits the seed's lIR"; else echo "note: F emits different lIR from the seed (main moved on)"; fi
          build "$RUNNER_TEMP/F" "$RUNNER_TEMP/F3"
          emit "$RUNNER_TEMP/F3" > "$RUNNER_TEMP/emit.F3"
          cmp "$RUNNER_TEMP/emit.F" "$RUNNER_TEMP/emit.F3"
          echo "stage check: F (built by the seed) and F3 (built by F) emit the same lIR"

      - name: Cases under stage 2
        # Measured on a hosted runner: ownership 179 s, modules 18 s,
        # stdlib 815-1098 s over three runs; the limits are about twice that.
        timeout-minutes: 60
        env:
          LIMIT_OWNERSHIP: 600
          LIMIT_MODULES: 120
          LIMIT_STDLIB: 2400
        run: |
          export FIB_LIB=$PWD/lib LD_LIBRARY_PATH=$PWD/target/release
          scripts/ci-stage2.sh "$RUNNER_TEMP/F"
