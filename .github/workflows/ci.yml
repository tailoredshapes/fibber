name: ci

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install stable toolchain with rustfmt and clippy
        run: |
          rustup update stable
          rustup default stable
          rustup component add rustfmt clippy

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --workspace

      # Pending cases exit 0 and are listed; a Fail, a bad header or a
      # run that found no cases exits 1 and must fail the build.
      - name: Ownership cases
        run: cargo run -p fibref -- cases cases/ownership
