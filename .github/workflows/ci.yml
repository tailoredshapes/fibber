name: ci

on:
  push:
  pull_request:

# The Rust jobs (fibref, lair, lairf) went with the Rust, ROADMAP stage 10; docs/rust-legacy.md says how to bring them back.
jobs:
  # The truth about main: the released seed (the one SEED names: a stage 2 binary) builds stage 2 from main's compiler/ and lib/; stage 2 links
  # LLVM 21 itself (the static archives of llvm-dev, as the release does, through scripts/llvm-static.sh); there is no Rust in the repository
  # (docs/rust-legacy.md); the fixed point holds; stage 2 runs the case directories, and the cases that do not pass are exactly those in
  # scripts/ci-stage2.expected; the golden checks of the passes hold (compiler/tests/golden).
  stage2:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 5

      # LLVM 21 for the link: llvm-21-dev has the static archives and llvm-config; zstd and zlib are the system libraries they name.
      - name: Install LLVM 21
        timeout-minutes: 15
        run: |
          wget -qO llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 21
          sudo apt-get install -y llvm-21-dev libzstd-dev zlib1g-dev libxml2-dev libcurl4-openssl-dev python3 openssl
          echo "LLVM_CONFIG=/usr/lib/llvm-21/bin/llvm-config" >> "$GITHUB_ENV"

      # The full gate is `make gate` (docs/design/build.md): the seed SEED names is fetched (gh, with the token) and verified under build/seed/,
      # stage 2 is built from it with LLVM linked statically (as the release does), the fixed point, the golden checks, the tool tests, the ADRs
      # and every case directory are stamps under build/. -k runs every stage; the report then says PASS or FAIL.
      # Measured on a hosted runner (before make): ownership 179 s, modules 18 s, stdlib 815-1098 s; the limits are about twice that.
      - name: The gate (make)
        timeout-minutes: 100
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          make -k -j4 gate-stamps LLVM_LINK=static CASE_JOBS=4 LIMIT_STDLIB=2400 LIMIT_OWNERSHIP=600 || true
          make gate-report LLVM_LINK=static

      - name: Keep the logs of a failed gate
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gate-logs
          path: |
            build/*.log
            build/*/*.log
            build/cases/*.txt
            build/cases/*.err

      - name: Native OS services and ABI conformance
        timeout-minutes: 5
        run: OS_FIBC="$PWD/build/F" OS_TEST_OUT="$RUNNER_TEMP/os" bash scripts/test-os.sh

      - name: Native HTTP interoperability and TLS
        timeout-minutes: 10
        run: HTTP_FIBC="$PWD/build/F" HTTP_TEST_OUT="$RUNNER_TEMP/http" bash scripts/test-http.sh

  # macOS (Apple Silicon, the macos-14 runner): `gmake mac-check` (mk/mac.mk): the gate less what macOS cannot run (compiler/tests/expected-macos.txt, each
  # skip with its reason), plus the machine checks of scripts/mac-check.sh. The seed is SEED's darwin-arm64 row. UNTESTED ON THE RUNNER: the job was
  # written from a run on an M1 Ultra (macOS 27, Homebrew llvm@21), not run on GitHub; a first run here may need the paths or the timeout adjusted.
  macos:
    runs-on: macos-14
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 5

      # llvm@21 is keg-only (/opt/homebrew/opt/llvm@21; `llvm` alone is 22); make gives gmake (macOS has GNU Make 3.81, which the Makefile refuses)
      - name: Install LLVM 21 and GNU Make
        timeout-minutes: 15
        run: brew install llvm@21 make

      - name: The Mac gate (gmake mac-check)
        timeout-minutes: 120
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gmake -k -j4 mac-stamps CASE_JOBS=4 LIMIT_STDLIB=3600 LIMIT_OWNERSHIP=1200 || true
          gmake mac-report

      - name: Keep the logs of a failed Mac gate
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mac-gate-logs
          path: |
            build/*.log
            build/*/*.log
            build/cases/*.txt
            build/cases/*.err
