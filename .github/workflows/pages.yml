name: pages

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'mkdocs.yml'
      - 'docs/**'
      - 'spec/**'
      - 'lib/**/README.md'
      - 'examples/README.md'
      - 'README.md'
      - 'CONTRIBUTING.md'
      - 'CHANGELOG.md'
      - 'SECURITY.md'
      - 'VERSION'
      - '.github/workflows/pages.yml'
  pull_request:
    paths:
      - 'website/**'
      - 'mkdocs.yml'
      - 'docs/**'
      - 'spec/**'
      - 'lib/**/README.md'
      - 'examples/README.md'
      - 'README.md'
      - 'CONTRIBUTING.md'
      - 'CHANGELOG.md'
      - 'SECURITY.md'
      - 'VERSION'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: website/requirements.txt
      - name: Install site dependencies
        run: python -m pip install -r website/requirements.txt
      - name: Check the publishing tools
        run: python website/tests.py
      - name: Build and validate the site
        run: |
          python website/prepare.py
          python -m mkdocs build --strict
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/pages
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
